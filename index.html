<style>

</style></head><body>
<header class="top"><b>📈 Spot Journal</b><nav id="nav"></nav><div class="th" id="th"></div></header><main id="m"></main><dialog id="dlg"></dialog><div id="toast"></div>
<script>
/* ===== STORAGE (swap this layer for a backend later) ===== */
const K='spotjournal.v1';
const Store={load(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}},save(d){try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}};
let D=Store.load()||{n:1,s:{theme:'dark',cur:'USDT',tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',bal:10000,ex:['Binance','Bybit','OKX'],conf:true},p:[],m:[]};
const sv=()=>Store.save(D);
/* ===== CALC ENGINE (pure) ===== */
const Calc={
 exec(p,x){const f=p.fee*x.qty/p.qty,cost=p.entry*x.qty+f;let net,gross;
  if(x.manual!=null&&x.manual!==''){net=+x.manual;gross=net;}else{gross=(x.price-p.entry)*x.qty;net=gross-f-(x.fee||0);}
  return{gross,net,cost,fees:f+(x.fee||0),ret:cost>0?net/cost*100:0}},
 rem(p){return Math.max(0,p.qty-p.execs.reduce((a,x)=>a+x.qty,0))},
 rr(e,t,s){const r=e-s;return r>0?(t-e)/r:0},
 pf(w,l){return l?w/Math.abs(l):(w?Infinity:0)},
 exp(wr,aw,al){return wr*aw-(1-wr)*Math.abs(al)}
};
const f=(n,d=2)=>n==null||!isFinite(n)?'—':(+n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const sg=n=>(n>0?'+':'')+f(n),cl=n=>n>0?'pos':n<0?'neg':'',esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=d=>new Intl.DateTimeFormat('en-CA',{timeZone:D.s.tz}).format(new Date(d));
const wk=k=>{const d=new Date(k+'T00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10)};
const addD=(k,n)=>{const d=new Date(k+'T00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const pad=n=>String(n).padStart(2,'0');
function data(){const rows=[],T=[];D.p.forEach(p=>{let net=0,cost=0,last=null;p.execs.forEach(x=>{const c=Calc.exec(p,x);rows.push({...x,...c,p,k:dk(x.date)});net+=c.net;cost+=c.cost;last=x.date});
 if(p.execs.length&&Calc.rem(p)<1e-9)T.push({p,net,ret:cost?net/cost*100:0,k:dk(last),hold:(new Date(last)-new Date(p.date))/864e5})});
 rows.sort((a,b)=>a.date<b.date?-1:1);T.sort((a,b)=>a.k<b.k?-1:1);return{rows,T}}
function met(rows,T,a,b){const r=rows.filter(x=>x.k>=a&&x.k<=b),t=T.filter(x=>x.k>=a&&x.k<=b),w=t.filter(x=>x.net>0),l=t.filter(x=>x.net<0);
 const gp=r.filter(x=>x.net>0).reduce((s,x)=>s+x.net,0),gl=r.filter(x=>x.net<0).reduce((s,x)=>s+x.net,0),pre=rows.filter(x=>x.k<a).reduce((s,x)=>s+x.net,0),base=D.s.bal+pre;
 return{net:gp+gl,gp,gl,n:t.length,w:w.length,l:l.length,wr:t.length?w.length/t.length*100:0,aw:w.length?w.reduce((s,x)=>s+x.net,0)/w.length:0,al:l.length?l.reduce((s,x)=>s+x.net,0)/l.length:0,ret:base?(gp+gl)/base*100:0,tp:r.filter(x=>x.kind=='TP').length,sl:r.filter(x=>x.kind=='SL').length,opened:D.p.filter(p=>dk(p.date)>=a&&dk(p.date)<=b).length,closed:r.length}}
/* ===== CHARTS (SVG) ===== */
const emp=m=>`<div class="em">${m||'No data yet.'}</div>`;
function bars(d,h=110){if(!d.length)return emp();const W=300,a=h-14,neg=d.some(x=>x.v<0),z=neg?a/2:a,mx=Math.max(1e-9,...d.map(x=>Math.abs(x.v))),sc=(z-5)/mx,bw=W/d.length,st=Math.ceil(d.length/7);
 return`<svg viewBox="0 0 ${W} ${h}">`+(neg?`<line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--bd)"/>`:'')+d.map((x,i)=>{const hh=Math.max(Math.abs(x.v)*sc,1);return`<rect x="${i*bw+bw*.16}" y="${x.v>=0?z-hh:z}" width="${bw*.68}" height="${hh}" rx="2" fill="${x.v>=0?'var(--pos)':'var(--neg)'}"${x.cur?' opacity=".55"':''}><title>${x.l}: ${sg(x.v)}</title></rect>`+(i%st==0?`<text x="${i*bw+bw/2}" y="${h-3}" text-anchor="middle">${x.l}</text>`:'')}).join('')+'</svg>'}
function line(d,h=110){if(d.length<2)return emp('Close at least 2 trades to draw the curve.');const W=300,mn=Math.min(...d.map(x=>x.v)),mx=Math.max(...d.map(x=>x.v)),r=mx-mn||1,X=i=>i/(d.length-1)*(W-8)+4,Y=v=>h-14-(v-mn)/r*(h-26)-4;
 const p=d.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(x.v).toFixed(1)}`).join('');
 return`<svg viewBox="0 0 ${W} ${h}"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".35"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs><path d="${p}L${X(d.length-1)} ${h-14}L4 ${h-14}Z" fill="url(#lg)"/><path d="${p}" fill="none" stroke="var(--ac)" stroke-width="2"/>`+d.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="2.2" fill="var(--ac2)"><title>${x.l}: ${f(x.v)}</title></circle>`).join('')+`<text x="4" y="${h-2}">${d[0].l}</text><text x="${W-4}" y="${h-2}" text-anchor="end">${d.at(-1).l}</text></svg>`}
function donut(ps,ctr){const t=ps.reduce((s,x)=>s+x.v,0);if(!t)return emp();let o=25;return`<svg viewBox="0 0 42 42" style="max-height:130px"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--cd2)" stroke-width="6"/>`+ps.map(x=>{const l=x.v/t*100,s=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${x.c}" stroke-width="6" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${o}"><title>${x.l}: ${x.v}</title></circle>`;o-=l;return s}).join('')+`<text x="21" y="22.5" text-anchor="middle" style="font-size:6px;fill:var(--tx);font-weight:700">${ctr}</text></svg>`}
/* ===== UI HELPERS ===== */
let page='Dashboard',dayOff=0,F={q:'',ex:'',from:'',to:''},SO={k:'date',d:-1};
const PAGES=['Dashboard','Open Positions','Take Profit','Stop Loss','Missed Trades','Analytics','Settings'];
const toast=(m,e)=>{const t=document.getElementById('toast');t.textContent=m;t.style.background=e?'var(--neg)':'var(--ac)';t.style.color=e?'#fff':'#04202b';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};
function conf(msg,fn){if(!D.s.conf)return fn();const d=document.getElementById('dlg');d.innerHTML=`<h3>Please confirm</h3><p>${msg}</p><div class="bar"><span class="sp"></span><button class="b s" onclick="dlg.close()">Cancel</button><button class="b d" id="ok">Delete</button></div>`;d.showModal();document.getElementById('ok').onclick=()=>{d.close();fn()}}
function form(title,fs,cb,sub='Save'){const d=document.getElementById('dlg');d.innerHTML=`<h3>${title}</h3><form class="f" method="dialog">`+fs.map(x=>`<label class="${x.w?'w':''}">${x.l}${x.t=='select'?`<select name="${x.k}">${x.o.map(o=>`<option ${o==x.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:x.t=='textarea'?`<textarea name="${x.k}" placeholder="${esc(x.ph||'')}">${esc(x.v)}</textarea>`:`<input name="${x.k}" type="${x.t||'text'}" ${x.t=='number'?'step="any"':''} value="${esc(x.v)}" ${x.r?'required':''}>`}</label>`).join('')+`<div class="w bar"><span class="sp"></span><button type="button" class="b s" onclick="dlg.close()">Cancel</button><button class="b">${sub}</button></div></form>`;
 d.showModal();d.querySelector('form').onsubmit=e=>{const v=Object.fromEntries(new FormData(e.target));try{if(cb(v)===false){e.preventDefault();return}}catch(x){e.preventDefault();toast(x.message,1)}}}
const iso=v=>new Date(v+'T12:00:00').toISOString();const today=()=>dk(Date.now());
const exOpts=()=>D.s.ex.length?D.s.ex:['Other'];
function render(){document.documentElement.dataset.t=D.s.theme;
 document.getElementById('nav').innerHTML=PAGES.map(p=>`<button class="pill ${p==page?'on':''}" onclick="go('${p}')">${p}</button>`).join('');
 document.getElementById('th').innerHTML=[['dark','☾','Dark'],['light','☀','Light'],['soft','◐','Soft light']].map(t=>`<button class="${D.s.theme==t[0]?'on':''}" title="${t[2]}" onclick="theme('${t[0]}')">${t[1]}</button>`).join('');
 document.getElementById('m').innerHTML=PG[page]()}
const go=p=>{page=p;F={q:'',ex:'',from:'',to:''};SO={k:'date',d:-1};render()};const theme=t=>{D.s.theme=t;sv();render()};
const cur=D.s.cur;const U=()=>D.s.cur;
/* ===== POSITION ACTIONS ===== */
const posFields=p=>[{k:'pair',l:'Coin / pair',v:p?.pair||'',r:1,ph:'BTC/USDT'},{k:'ex',l:'Exchange',t:'select',o:exOpts(),v:p?.ex},{k:'entry',l:'Entry price',t:'number',v:p?.entry,r:1},{k:'amt',l:`Amount purchased (${U()})`,t:'number',v:p?+(p.qty*p.entry).toFixed(4):'',r:1},{k:'tp',l:'Take profit price',t:'number',v:p?.tp,r:1},{k:'sl',l:'Stop loss price',t:'number',v:p?.sl,r:1},{k:'date',l:'Entry date',t:'date',v:p?dk(p.date):today(),r:1},{k:'fee',l:`Entry fees (${U()})`,t:'number',v:p?.fee??0},{k:'tf',l:'Timeframe',t:'select',o:['15m','1h','4h','1D','1W'],v:p?.tf},{k:'notes',l:'Analysis & notes (why entered, BOS/CHoCH, liquidity, FVG, S/R, confirmation, risks)',t:'textarea',v:p?.notes,w:1}];
function editPos(id){const p=D.p.find(x=>x.id==id);form(p?'Edit '+p.id:'New position',posFields(p),v=>{const o={pair:v.pair.toUpperCase().trim(),ex:v.ex,entry:+v.entry,qty:+v.amt/+v.entry,tp:+v.tp,sl:+v.sl,date:iso(v.date),fee:+v.fee||0,tf:v.tf,notes:v.notes};
 if(o.entry<=0||o.qty<=0)throw Error('Entry price and quantity must be above zero.');if(o.sl>=o.entry||o.tp<=o.entry)throw Error('Spot long: SL must be below entry and TP above it.');
 if(p){if(o.qty<p.execs.reduce((a,x)=>a+x.qty,0))throw Error('Quantity is below what has already been sold.');Object.assign(p,o);toast('Position updated')}else{D.p.push({id:'P-'+String(D.n++).padStart(3,'0'),...o,cur:null,st:'Other',execs:[],arch:false});toast('Position added')}sv();render()})}
function closeM(pid,kind,full){const op=D.p.filter(p=>!p.arch&&Calc.rem(p)>1e-9);if(!op.length)return toast('No open positions to close. Add one first.',1);const p0=D.p.find(x=>x.id==pid)||op[0];
 form(kind=='SL'?'Record stop loss':kind=='TP'?'Record take profit':'Close position',[{k:'pid',l:'Position',t:'select',o:op.map(p=>p.id+' · '+p.pair+' · '+p.ex),v:p0.id+' · '+p0.pair+' · '+p0.ex,w:1},{k:'kind',l:'Result',t:'select',o:['TP','SL'],v:kind||'TP'},{k:'meth',l:'Realization method',t:'select',o:['Exit price','Manual P&L amount'],v:'Exit price'},{k:'pct',l:'% of remaining position (25/50/75/100 or custom)',t:'number',v:full===false?50:100},{k:'price',l:'Exit price',t:'number',v:kind=='SL'?p0.sl:p0.tp},{k:'fee',l:'Exit fees',t:'number',v:0},{k:'manual',l:'Manual net P&L (signed, used if method = manual)',t:'number',v:''},{k:'date',l:'Date',t:'date',v:today()},{k:'reason',l:'Reason / notes',t:'textarea',v:'',w:1}],v=>{
 const p=D.p.find(x=>x.id==v.pid.split(' · ')[0]),r=Calc.rem(p),pc=+v.pct;if(!(pc>0&&pc<=100))throw Error('Percentage must be between 0 and 100.');const man=v.meth.startsWith('Manual');if(man&&v.manual==='')throw Error('Enter the manual P&L amount.');if(!man&&!(+v.price>0))throw Error('Enter a valid exit price.');
 const x={id:'X'+Date.now(),date:iso(v.date),kind:v.kind,qty:r*pc/100,price:+v.price,fee:+v.fee||0,manual:man?+v.manual:null,pct:pc,full:pc>=100,reason:v.reason};
 if(v.kind=='TP'&&Calc.exec(p,x).net<0)throw Error('A TP record must be a profit. Use Stop Loss for losses.');if(v.kind=='SL'&&Calc.exec(p,x).net>0)throw Error('An SL record must be a loss. Use Take Profit for gains.');
 p.execs.push(x);sv();toast((v.kind=='TP'?'Take profit':'Stop loss')+' recorded'+(Calc.rem(p)<1e-9?' – position closed':' – partial'));render()},'Record')}
const archive=id=>{const p=D.p.find(x=>x.id==id);p.arch=true;sv();toast('Position archived');render()};
const delPos=id=>conf('Delete this position and its exits? Statistics will update.',()=>{D.p=D.p.filter(p=>p.id!=id);sv();toast('Position deleted');render()});
const setCur=id=>{const p=D.p.find(x=>x.id==id);form('Current price – '+p.pair,[{k:'c',l:'Market price',t:'number',v:p.cur??'',r:1}],v=>{p.cur=+v.c;sv();render()})};
/* ===== PAGES ===== */
const hdr=(a,b)=>`<div class="bar"><b>${a}</b><span class="sp"></span>${b||''}</div>`;
function sample(){const co=[['BTC/USDT',60000],['ETH/USDT',2400],['SOL/USDT',150],['BNB/USDT',580],['XRP/USDT',0.55]],st=['FVG','Liquidity Sweep','BOS','CHoCH','Support/Resistance'],now=Date.now();
 for(let i=0;i<16;i++){const [pair,pr]=co[i%5],e=pr*(1+((i*7)%5-2)/100),qty=+(600/e).toFixed(6),back=84-i*5,p={id:'P-'+String(D.n++).padStart(3,'0'),pair,ex:D.s.ex[i%D.s.ex.length],entry:e,qty,tp:e*1.06,sl:e*.97,date:new Date(now-back*864e5).toISOString(),fee:.6,cur:null,tf:['1h','4h','1D'][i%3],st:st[i%5],notes:'Sample data',execs:[],arch:false,sample:1},loss=i%3==1,xd=new Date(now-(back-2)*864e5).toISOString();
  if(i<14){if(i%4==3){p.execs.push({id:'S'+i+'a',date:xd,kind:'TP',qty:qty/2,price:e*1.04,fee:.3,manual:null,pct:50,full:false});p.execs.push({id:'S'+i+'b',date:new Date(now-(back-3)*864e5).toISOString(),kind:'TP',qty:qty/2,price:e*1.07,fee:.3,manual:null,pct:100,full:true})}else p.execs.push({id:'S'+i,date:xd,kind:loss?'SL':'TP',qty,price:loss?p.sl:p.tp,fee:.6,manual:null,pct:100,full:true,reason:loss?['Structure broke','Early exit','News spike'][i%3]:''})}else p.cur=e*1.02}
 for(let i=0;i<4;i++)D.m.push({id:'M'+Date.now()+i,pair:co[i][0],ex:D.s.ex[0],e:co[i][1],tp:co[i][1]*1.05,sl:co[i][1]*.98,date:new Date(now-(10+i*6)*864e5).toISOString(),cat:['Fear or hesitation','Lack of confirmation','Missed entry','Insufficient time'][i],notes:'Sample data',out:['TP Hit','SL Hit','TP Hit','Pending'][i],odate:'',sample:1});sv();render();toast('Sample data loaded – remove it in Settings')}
const noData=()=>`<div class="c" style="margin:auto;max-width:460px;height:auto;text-align:center"><h3 style="justify-content:center">Your journal is empty</h3><p class="mu">Add your first position, or load labelled sample data to explore the dashboard.</p><div class="bar" style="justify-content:center"><button class="b" onclick="editPos()">Add position</button><button class="b s" onclick="sample()">Load sample data</button></div></div>`;
function kvs(a){return`<div class="kv">${a.map(x=>`<span>${x[0]}</span><span class="${x[2]||''}">${x[1]}</span>`).join('')}</div>`}
function sgs(a){return`<div class="sg">${a.map(x=>`<div><i>${x[0]}</i><b class="${x[2]||''}">${x[1]}</b></div>`).join('')}</div>`}
